version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports: ["5000:5000"]
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/finflow_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on: [mongo, redis]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/finflow_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on: [mongo, redis]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  mongo_data:
  redis_data:
